name: Swallow build

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-gui:
    name: Build gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: swallow-windows
            output: swallow.exe
            binary: build/bin/swallow.exe
            webview2: -webview2 download
          - os: macos-latest
            platform: darwin/universal
            artifact: swallow-darwin
            output: swallow
            binary: build/bin/swallow-darwin.app.zip
            webview2: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm install --force

      - name: Install Rollup Windows native package
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: bash
        run: npm install @rollup/rollup-win32-x64-msvc@4.18.0 --no-save --force

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build app
        shell: bash
        run: wails build --platform ${{ matrix.platform }} ${{ matrix.webview2 }} -o ${{ matrix.output }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent build/bin/${{ matrix.output }}.app build/bin/swallow-darwin.app.zip
          rm -rf build/bin/${{ matrix.output }}.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  collect-release:
    name: Collect and release
    needs: [build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: target

      - name: List release files
        run: ls -al target

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: target/*
          generate_release_notes: true
