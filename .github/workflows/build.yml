name: Swallow build

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-gui:
    name: Build gui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            output: swallow.exe
          - os: macos-latest
            platform: darwin/universal
            output: swallow
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Reinstall frontend optional dependencies on Windows
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force
          }
          npm install --include=optional --force

      - uses: dAppServer/wails-build-action@main
        with:
          build-name: ${{ matrix.output }}
          build-platform: ${{ matrix.platform }}
          go-version: 1.22.4
          node-version: '20'
          package: false

      - if: runner.os == 'macOS'
        shell: bash
        run: |
          zip -q -r -j ./build/bin/${{ matrix.output }}.app.zip ./build/bin/${{ matrix.output }}.app
          rm -rf ./build/bin/${{ matrix.output }}.app

      - uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.os }}
          path: build/bin/*

  collect-release:
    name: Collect and release
    needs: [build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: target-*
          merge-multiple: true
          path: target

      - name: Prepare release files
        working-directory: target
        run: |
          ls -al
          rm -f swallow-amd64-installer.exe
          rm -f swallow.pkg
          mv swallow.app.zip swallow-darwin.app.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          files: target/*
          generate_release_notes: true
